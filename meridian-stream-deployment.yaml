apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-stream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meridian-stream
  template:
    metadata:
      labels:
        app: meridian-stream
    spec:
      securityContext:
        fsGroup: 185
      containers:
        - name: spark
          image: apache/spark:3.5.3-java17-scala
          envFrom:
            - configMapRef:
                name: meridian-stream
          command: ["/bin/bash", "-ec"]
          args:
            - |
              /opt/spark/bin/spark-shell \
                --master 'local[2]' \
                --driver-memory 1g \
                --conf spark.ui.enabled=false \
                --conf spark.sql.shuffle.partitions=4 \
                --conf spark.jars.ivy=/tmp/meridian-ivy \
                --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
                --conf spark.sql.catalog.meridian=org.apache.iceberg.spark.SparkCatalog \
                --conf spark.sql.catalog.meridian.type=hadoop \
                --conf spark.sql.catalog.meridian.warehouse=file:///meridian/warehouse \
                --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.12.0 \
                -i /app/meridian-stream.scala </dev/null
              touch /tmp/meridian-replay-complete
              exec sleep infinity
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/meridian-replay-complete"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /meridian
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: meridian-stream-state
        - name: script
          configMap:
            name: meridian-stream
            items:
              - key: meridian-stream.scala
                path: meridian-stream.scala
